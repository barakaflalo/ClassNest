/* =====================================================================
   v1.1 — one-time changes · students & submissions · prep for next lesson · recurring reminders
   ===================================================================== */

/* ---------- prep: shown in the real next lesson of that class+subject (follows cancellations) ---------- */
function prepTarget(p){
  if(!p.classId) return null;
  return nextLesson(p.classId, p.subjectId, p.fromDate, p.fromMin != null ? p.fromMin : 1439);
}

/* ---------- one-time changes ---------- */
const CANCEL_REASONS = ['טיול','מבחן','אירוע בית ספר','היעדרות שלי','חופש לכיתה','אחר'];
function periodOptions(sel){ return S.settings.bells.map(b => `<option value="${b.n}" ${b.n===sel?'selected':''}>שיעור ${b.n} (${b.start})</option>`).join(''); }
function editOverride(date, slotId){
  const plan = dayPlan(date).find(x => x.slot.id === slotId);
  const base = S.slots.find(s => s.id === slotId);
  const isExtra = !!(plan ? plan.slot.extra : extraSlot(slotId));
  const ov = plan && plan.ov;
  const cur = plan ? plan.slot : (base || extraSlot(slotId));
  if(!cur){ toast('השיעור לא נמצא', true); return; }
  let mode = ov && ov.type === 'change' ? 'change' : 'cancel';
  let reason = ov && ov.type === 'cancel' && CANCEL_REASONS.includes(ov.note) ? ov.note : '';
  openModal(`<h2>שינוי בשיעור</h2><p class="muted">${esc(fmtDate(date))} · שיעור ${cur.period} · ${esc(slotLabel(cur))}</p>
    ${plan && plan.status === 'cancelled' && !ov ? `<div class="banner info">השיעור מבוטל בגלל אירוע: ${esc(plan.reason)}. אפשר לשנות את זה במסך האירועים.</div>` : ''}
    <div class="seg" id="ovMode">${isExtra ? '' : '<button data-m="cancel">❌ מבוטל</button>'}<button data-m="change">🔄 מילוי מקום / החלפה</button><button data-m="move">📆 הזזה ליום אחר</button></div>
    <div id="ovCancel">
      <span class="small" style="font-weight:700">סיבה</span>
      <div class="seg" id="ovReason">${CANCEL_REASONS.map(r => `<button data-r="${esc(r)}" class="${r===reason?'on':''}">${esc(r)}</button>`).join('')}</div>
      <label class="f"><span>פירוט (לא חובה)</span><input type="text" id="ovNote" value="${esc(ov && ov.type==='cancel' && !CANCEL_REASONS.includes(ov.note) ? ov.note || '' : '')}" placeholder="למשל: טיול שכבתי לירושלים"></label>
    </div>
    <div id="ovChange" hidden>
      <p class="hint">למשל: אתה ממלא מקום בכיתה אחרת, או שהמקצוע הוחלף בשיעור הזה בלבד.</p>
      <div class="row2"><label class="f"><span>כיתה</span><select id="ovClass">${optionList(S.classes, (ov && ov.classId) || cur.classId)}</select></label>
      <label class="f"><span>מקצוע</span><select id="ovSub">${optionList(S.subjects, ov && ov.type==='change' ? ov.subjectId : cur.subjectId, '—')}</select></label></div>
      <label class="f"><span>הערה</span><input type="text" id="ovCNote" value="${esc(ov && ov.type==='change' ? ov.note || '' : '')}" placeholder="למשל: מילוי מקום"></label>
    </div>
    <div id="ovMove" hidden>
      <div class="row2"><label class="f"><span>לתאריך</span><input type="date" id="ovDate" value="${esc(addDays(date, 1))}"></label>
      <label class="f"><span>שיעור</span><select id="ovPeriod">${periodOptions(cur.period)}</select></label></div>
    </div>
    <div class="modal-actions"><button class="btn primary" id="ovSave">שמור שינוי</button>
      ${ov ? `<button class="btn danger" id="ovUndo">${isExtra ? 'מחק את השיעור הנוסף' : 'בטל שינוי — מתקיים כרגיל'}</button>` : ''}<button class="btn" id="ovNo">ביטול</button></div>`,
  m => {
    const upd = () => {
      $$('#ovMode button', m).forEach(b => b.classList.toggle('on', b.dataset.m === mode));
      $('#ovCancel', m).hidden = mode !== 'cancel'; $('#ovChange', m).hidden = mode !== 'change'; $('#ovMove', m).hidden = mode !== 'move';
    };
    if(isExtra && mode === 'cancel') mode = 'change';
    upd();
    $$('#ovMode button', m).forEach(b => b.onclick = () => { mode = b.dataset.m; upd(); });
    $$('#ovReason button', m).forEach(b => b.onclick = () => { reason = b.dataset.r; $$('#ovReason button', m).forEach(x => x.classList.toggle('on', x === b)); });
    $('#ovNo', m).onclick = () => closeModal();
    const removeOv = () => { if(ov) S.overrides = S.overrides.filter(o => o !== ov && o.id !== ov.linkId && o.linkId !== ov.id); };
    $('#ovSave', m).onclick = () => {
      if(mode === 'cancel'){
        removeOv();
        const note = $('#ovNote', m).value.trim() || reason || 'בוטל';
        S.overrides.push({id:uid(), type:'cancel', date, slotId, note});
      }else if(mode === 'change'){
        const classId = $('#ovClass', m).value, subjectId = $('#ovSub', m).value, note = $('#ovCNote', m).value.trim();
        if(isExtra){ const o = S.overrides.find(x => x.id === slotId); Object.assign(o, {classId, subjectId, note: note || o.note}); }
        else { removeOv(); S.overrides.push({id:uid(), type:'change', date, slotId, classId, subjectId, note}); }
      }else{
        const nd = $('#ovDate', m).value, np = +$('#ovPeriod', m).value;
        if(!nd){ toast('בחר תאריך', true); return; }
        if(isNoSchool(nd)){ toast('ביום הזה אין לימודים: ' + isNoSchool(nd).reason, true); return; }
        const exId = uid();
        if(isExtra){ const o = S.overrides.find(x => x.id === slotId); o.date = nd; o.period = np; }
        else {
          removeOv();
          const cId = uid();
          S.overrides.push({id:cId, type:'cancel', date, slotId, note:`הוזז ל${fmtDate(nd)}`, linkId:exId});
          S.overrides.push({id:exId, type:'extra', date:nd, period:np, classId:cur.classId, subjectId:cur.subjectId, room:cur.room||'', note:`הוזז מ${fmtDate(date,false)}`, linkId:cId});
        }
      }
      save(); closeModal(); afterScheduleChange(); rerender(); toast('השינוי נשמר');
    };
    const undo = $('#ovUndo', m);
    if(undo) undo.onclick = async () => {
      if(isExtra){
        if(!(await confirmBox('למחוק את השיעור הנוסף? סיכום שנכתב בו נשאר ביומן.', 'מחק', true))) return;
        const o = S.overrides.find(x => x.id === slotId);
        S.overrides = S.overrides.filter(x => x.id !== slotId && x.id !== (o && o.linkId));
      }else removeOv();
      save(); closeModal(); afterScheduleChange();
      if(isExtra && current === 'lesson') go('home'); else rerender();
      toast('עודכן');
    };
  });
}
function addExtraLesson(date){
  if(!S.classes.length){ toast('צריך קודם להוסיף כיתות', true); return; }
  openModal(`<h2>שיעור נוסף / מילוי מקום</h2><p class="muted">${esc(fmtDate(date))}</p>
    <label class="f"><span>שיעור</span><select id="xP">${periodOptions(1)}</select></label>
    <div class="row2"><label class="f"><span>כיתה</span><select id="xC">${optionList(S.classes, '')}</select></label>
    <label class="f"><span>מקצוע</span><select id="xS">${optionList(S.subjects, '', '—')}</select></label></div>
    <label class="f"><span>הערה</span><input type="text" id="xN" placeholder="למשל: מילוי מקום, תגבור"></label>
    <div class="modal-actions"><button class="btn primary" id="xOk">הוסף</button><button class="btn" id="xNo">ביטול</button></div>`, m => {
    $('#xNo', m).onclick = () => closeModal();
    $('#xOk', m).onclick = () => {
      S.overrides.push({id:uid(), type:'extra', date, period:+$('#xP', m).value, classId:$('#xC', m).value, subjectId:$('#xS', m).value, note:$('#xN', m).value.trim()});
      save(); closeModal(); rerender(); toast('השיעור נוסף ליום הזה');
    };
  });
}
function pruneOverrides(){
  const lim = addDays(todayStr(), -120);
  const before = S.overrides.length;
  S.overrides = S.overrides.filter(o => o.date >= lim || Object.keys(S.lessons).some(k => k.endsWith('|' + o.id)));
  if(S.overrides.length !== before) save();
}

/* ---------- students & homework submissions ---------- */
const SUB_STATES = {done:{ic:'✓', label:'הגיש'}, missing:{ic:'✗', label:'לא הגיש'}, absent:{ic:'⌀', label:'חסר'}};
function classStudents(classId){
  return (S.students || []).filter(s => s.classId === classId && !s.archived).sort((a,b) => a.name.localeCompare(b.name, 'he'));
}
function subsSummary(t){
  if(!t || t.kind !== 'hw' || !t.subs) return '';
  const v = Object.values(t.subs), miss = v.filter(x => x === 'missing').length, done = v.filter(x => x === 'done').length;
  if(!v.length) return '';
  return miss ? `<span class="tag warn">${miss} לא הגישו</span>` : `<span class="tag ok">${done} הגישו</span>`;
}
function markSubs(t){
  if(!t) return;
  const list = classStudents(t.classId);
  if(!list.length){ manageStudents(t.classId); return; }
  const subs = {...(t.subs || {})};
  const draw = m => {
    const c = {done:0, missing:0, absent:0}; Object.values(subs).forEach(v => c[v] = (c[v]||0) + 1);
    $('#sbCount', m).textContent = `✓ ${c.done} · ✗ ${c.missing} · ⌀ ${c.absent} · לא סומנו ${list.length - c.done - c.missing - c.absent}`;
    list.forEach(s => $$(`[data-st="${s.id}"] button`, m).forEach(b => b.classList.toggle('on', subs[s.id] === b.dataset.v)));
  };
  openModal(`<h2>מי הגיש?</h2><p class="muted">${esc(t.title)} · ${esc(cls(t.classId) ? cls(t.classId).name : '')}</p>
    <div class="btn-row"><button class="btn sm" id="sbAll">כולם הגישו</button><button class="btn sm" id="sbClr">נקה</button></div>
    <p class="hint" id="sbCount" aria-live="polite"></p>
    <div>${list.map(s => `<div class="subrow"><span class="nm">${esc(s.name)}</span><div class="seg" data-st="${s.id}" role="group" aria-label="${esc(s.name)}">
      ${Object.entries(SUB_STATES).map(([k,v]) => `<button data-v="${k}" aria-label="${v.label}" title="${v.label}">${v.ic}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="modal-actions"><button class="btn primary" id="sbDone">שמור וסמן כנבדק ✓</button><button class="btn" id="sbSave">שמור</button><button class="btn" id="sbNo">ביטול</button></div>`, m => {
    draw(m);
    list.forEach(s => $$(`[data-st="${s.id}"] button`, m).forEach(b => b.onclick = () => { subs[s.id] = subs[s.id] === b.dataset.v ? undefined : b.dataset.v; if(!subs[s.id]) delete subs[s.id]; hapt(); draw(m); }));
    $('#sbAll', m).onclick = () => { list.forEach(s => { if(subs[s.id] !== 'absent') subs[s.id] = 'done'; }); draw(m); };
    $('#sbClr', m).onclick = () => { Object.keys(subs).forEach(k => delete subs[k]); draw(m); };
    $('#sbNo', m).onclick = () => closeModal();
    const commit = done => { t.subs = subs; if(done){ t.done = true; t.doneAt = new Date().toISOString(); } save(); closeModal(); rerender(); toast(done ? 'נבדק ✓' : 'נשמר'); };
    $('#sbSave', m).onclick = () => commit(false);
    $('#sbDone', m).onclick = () => commit(true);
  });
}
function manageStudents(classId){
  const c = cls(classId);
  if(!c){ toast('בחר כיתה', true); return; }
  const list = classStudents(classId);
  openModal(`<h2>תלמידי ${esc(c.name)}</h2>
    <p class="hint">מומלץ שם פרטי או כינוי בלבד. הרשימה נשמרת רק במכשיר.</p>
    <label class="f"><span>הוספה — שם בכל שורה (אפשר להדביק רשימה)</span><textarea id="stAdd" style="min-height:90px" placeholder="נועה&#10;איתי&#10;מאיה ל."></textarea></label>
    <button class="btn sm" id="stAddBtn">＋ הוסף</button>
    <h3>${list.length} תלמידים</h3>
    <div>${list.map(s => `<div class="subrow"><span class="nm">${esc(s.name)}</span><button class="edit-btn" data-ren="${s.id}" aria-label="שינוי שם ${esc(s.name)}">✏️</button><button class="edit-btn" data-rm="${s.id}" aria-label="הסרת ${esc(s.name)}">🗑️</button></div>`).join('') || '<p class="muted small">עוד אין תלמידים ברשימה.</p>'}</div>
    <div class="modal-actions"><button class="btn primary" id="stClose">סיום</button></div>`, m => {
    $('#stAddBtn', m).onclick = () => {
      const names = $('#stAdd', m).value.split(/\n|,/).map(x => x.trim()).filter(Boolean);
      const exist = new Set(list.map(s => s.name));
      const add = names.filter(n => !exist.has(n));
      add.forEach(name => S.students.push({id:uid(), classId, name, note:'', archived:false}));
      save(); toast(add.length ? `נוספו ${add.length}` : 'לא נוספו שמות חדשים'); manageStudents(classId);
    };
    $$('[data-ren]', m).forEach(b => b.onclick = () => {
      const s = S.students.find(x => x.id === b.dataset.ren), n = (prompt('שם חדש:', s.name) || '').trim();
      if(n){ s.name = n; save(); manageStudents(classId); }
    });
    $$('[data-rm]', m).forEach(b => b.onclick = async () => {
      const s = S.students.find(x => x.id === b.dataset.rm);
      if(!(await confirmBox(`להסיר את ${s.name} מהרשימה? ההיסטוריה שלו נשמרת בגיבוי.`, 'הסר', true))) return;
      s.archived = true; save(); manageStudents(classId);
    });
    $('#stClose', m).onclick = () => { closeModal(); rerender(); };
  }, () => rerender());
}
let stClass = '';
RENDER.students = () => {
  const el = $('#scr-students');
  if(!stClass || !cls(stClass)) stClass = S.classes[0] ? S.classes[0].id : '';
  let html = head('תלמידים');
  if(!S.classes.length){ el.innerHTML = html + `<div class="empty">צריך קודם להוסיף כיתות. <button class="btn" data-go="setup">לבית הספר</button></div>`; return; }
  html += `<div class="seg" id="stSeg">${S.classes.map(c => `<button data-c="${c.id}" class="${c.id===stClass?'on':''}">${classDot(c.id)} ${esc(c.name)}</button>`).join('')}</div>`;
  const list = classStudents(stClass);
  const hws = S.tasks.filter(t => !t.deleted && t.kind === 'hw' && t.classId === stClass && t.subs && Object.keys(t.subs).length);
  if(!list.length){
    html += `<div class="empty">אין עדיין תלמידים ב${esc(cls(stClass).name)}.<br><button class="btn primary" id="stManage">＋ הוספת תלמידים</button></div>`;
  }else{
    const rows = list.map(s => {
      const c = {done:0, missing:0, absent:0};
      hws.forEach(t => { const v = t.subs[s.id]; if(v) c[v]++; });
      return {s, c};
    }).sort((a,b) => b.c.missing - a.c.missing || a.s.name.localeCompare(b.s.name, 'he'));
    html += `<p class="hint">לפי ${hws.length} שיעורי בית שסימנת בהם הגשות. ממוין לפי "לא הגיש".</p><div class="card">${rows.map(({s,c}) => `<div class="item" data-stu="${s.id}">
      <div class="item-main"><div class="item-title">${esc(s.name)}</div><div class="item-meta">${c.missing ? `<span class="tag warn">✗ ${c.missing} לא הגיש</span>` : ''}<span>✓ ${c.done}</span>${c.absent ? `<span>⌀ ${c.absent} חסר</span>` : ''}${s.note ? '<span>📝</span>' : ''}</div></div>
      <button class="edit-btn" data-stu-open="${s.id}" aria-label="פרטים">›</button></div>`).join('')}</div>
      <div class="btn-row"><button class="btn" id="stManage">✏️ ניהול הרשימה</button></div>`;
  }
  el.innerHTML = html;
  $$('#stSeg button').forEach(b => b.onclick = () => { stClass = b.dataset.c; RENDER.students(); });
  if($('#stManage')) $('#stManage').onclick = () => manageStudents(stClass);
  $$('[data-stu]', el).forEach(i => i.onclick = () => studentDetail(S.students.find(s => s.id === i.dataset.stu)));
};
function studentDetail(s){
  const hws = S.tasks.filter(t => !t.deleted && t.kind === 'hw' && t.classId === s.classId && t.subs && t.subs[s.id]).sort((a,b) => (b.dueDate||'').localeCompare(a.dueDate||''));
  const miss = hws.filter(t => t.subs[s.id] === 'missing');
  openModal(`<h2>${esc(s.name)}</h2><p class="muted">${esc(cls(s.classId) ? cls(s.classId).name : '')}</p>
    <h3>לא הגיש (${miss.length})</h3>${miss.length ? `<div>${miss.map(t => `<div class="subrow"><span class="nm" style="font-weight:600">${esc(t.title)}</span><span class="muted small">${t.dueDate ? esc(fmtDate(t.dueDate,false)) : ''}</span></div>`).join('')}</div>` : '<p class="muted small">אין. 👏</p>'}
    <label class="f"><span>הערה אישית (נשמרת רק במכשיר)</span><textarea id="sdNote" style="min-height:80px">${esc(s.note||'')}</textarea></label>
    <div class="modal-actions"><button class="btn primary" id="sdSave">שמור</button><button class="btn" id="sdNo">סגור</button></div>`, m => {
    $('#sdNo', m).onclick = () => closeModal();
    $('#sdSave', m).onclick = () => { s.note = $('#sdNote', m).value.trim(); save(); closeModal(); rerender(); toast('נשמר'); };
  });
}

/* ---------- recurring reminders ---------- */
function lastDayOfMonth(y, m){ return new Date(y, m + 1, 0).getDate(); }
function recurOccurrences(r, from, to){
  const out = [];
  if(r.freq === 'weekly'){
    for(let d = from; d <= to; d = addDays(d, 1)){
      if(!(r.days || []).includes(pd(d).getDay())) continue;
      if(r.skipHolidays && isNoSchool(d)) continue;
      out.push(d);
    }
  }else{
    const s = pd(from), e = pd(to);
    for(let y = s.getFullYear(), mo = s.getMonth(); y < e.getFullYear() || (y === e.getFullYear() && mo <= e.getMonth()); mo === 11 ? (y++, mo = 0) : mo++){
      const last = lastDayOfMonth(y, mo);
      let day = r.monthDay === 'last' ? last : Math.min(+r.monthDay || 1, last);
      let d = `${y}-${pad(mo+1)}-${pad(day)}`;
      if(r.skipHolidays){ let guard = 0; while(isNoSchool(d) && guard++ < 20) d = addDays(d, -1); }
      if(d >= from && d <= to) out.push(d);
    }
  }
  return out;
}
function ensureRecurring(){
  const today = todayStr(); let made = 0;
  for(const r of S.recurring || []){
    if(r.paused) continue;
    r.gen = r.gen || {};
    const start = [r.createdAt ? r.createdAt.slice(0,10) : today, addDays(today, -7)].sort().pop();
    for(const occ of recurOccurrences(r, start, addDays(today, 14))){
      if(r.gen[occ]) continue;
      r.gen[occ] = 1; made++;
      S.tasks.push({id:uid(), kind:'task', title:r.title, notes:r.notes || '', classId:r.classId || '', subjectId:'', dueMode:'date', dueDate:occ, dueTime:r.time || '07:30', dueSlotId:'', done:false, createdAt:new Date().toISOString(), recurId:r.id});
    }
    const lim = addDays(today, -60);
    Object.keys(r.gen).forEach(k => { if(k < lim) delete r.gen[k]; });
  }
  if(made) save();
}
function recurLabel(r){
  const when = r.freq === 'weekly' ? 'כל ' + (r.days || []).slice().sort().map(d => DAYS[d]).join(', ') : r.monthDay === 'last' ? 'סוף כל חודש' : `כל ${r.monthDay} בחודש`;
  return `${when} · ${r.time || '07:30'}${r.skipHolidays ? ' · מדלג על חופשות' : ''}`;
}
function manageRecurring(){
  openModal(`<h2>🔁 תזכורות חוזרות</h2><p class="hint">למשל: כל חמישי לשלוח עדכון להורים, כל סוף חודש להזין ציונים. כל מופע מופיע ברשימת המשימות ואפשר לסמן אותו כבוצע.</p>
    ${(S.recurring||[]).length ? `<div>${S.recurring.map(r => `<div class="item" data-rec="${r.id}"><div class="item-main"><div class="item-title">${r.paused?'⏸️ ':''}${esc(r.title)}</div><div class="item-meta">${esc(recurLabel(r))}${r.classId && cls(r.classId) ? ' · ' + esc(cls(r.classId).name) : ''}</div></div><button class="edit-btn" aria-label="עריכה">✏️</button></div>`).join('')}</div>` : '<p class="muted">עוד אין תזכורות חוזרות.</p>'}
    <div class="modal-actions"><button class="btn primary" id="rcNew">＋ תזכורת חוזרת</button><button class="btn" id="rcClose">סגור</button></div>`, m => {
    $('#rcClose', m).onclick = () => closeModal();
    $('#rcNew', m).onclick = () => editRecurring(null);
    $$('[data-rec]', m).forEach(i => i.onclick = () => editRecurring(S.recurring.find(r => r.id === i.dataset.rec)));
  }, () => rerender());
}
function editRecurring(r){
  const d = r ? {...r, days:[...(r.days||[])]} : {id:uid(), title:'', freq:'weekly', days:[4], monthDay:'last', time:'07:30', classId:'', notes:'', skipHolidays:true, createdAt:new Date().toISOString()};
  openModal(`<h2>${r ? 'עריכת' : 'הוספת'} תזכורת חוזרת</h2>
    <label class="f"><span>מה להזכיר?</span><input type="text" id="rT" value="${esc(d.title)}" placeholder="למשל: לשלוח עדכון שבועי להורים"></label>
    <div class="seg" id="rF"><button data-f="weekly">כל שבוע</button><button data-f="monthly">כל חודש</button></div>
    <div id="rW"><span class="small" style="font-weight:700">באילו ימים</span><div class="seg" id="rD">${[0,1,2,3,4,5,6].map(x => `<button data-d="${x}" class="${d.days.includes(x)?'on':''}">${DAYS[x]}</button>`).join('')}</div></div>
    <label class="f" id="rM"><span>באיזה יום בחודש</span><select id="rMD"><option value="last" ${d.monthDay==='last'?'selected':''}>סוף החודש</option>${Array.from({length:28}, (_,i) => `<option value="${i+1}" ${String(d.monthDay)===String(i+1)?'selected':''}>${i+1}</option>`).join('')}</select></label>
    <div class="row2"><label class="f"><span>שעה</span><input type="time" id="rTime" value="${esc(d.time)}"></label>
    <label class="f"><span>כיתה (לא חובה)</span><select id="rC">${optionList(S.classes, d.classId, 'כללי')}</select></label></div>
    <label class="switch"><span>לדלג על חופשות<br><span class="hint">בחודשי: מקדים ליום הלימודים הקודם</span></span><input type="checkbox" id="rSk" ${d.skipHolidays?'checked':''}></label>
    ${r ? `<label class="switch"><span>מושהית</span><input type="checkbox" id="rP" ${d.paused?'checked':''}></label>` : ''}
    <label class="f"><span>הערות</span><input type="text" id="rN" value="${esc(d.notes||'')}"></label>
    <div class="modal-actions"><button class="btn primary" id="rOk">שמור</button>${r ? '<button class="btn danger" id="rDel">מחק</button>' : ''}<button class="btn" id="rNo">ביטול</button></div>`, m => {
    const upd = () => { $$('#rF button', m).forEach(b => b.classList.toggle('on', b.dataset.f === d.freq)); $('#rW', m).hidden = d.freq !== 'weekly'; $('#rM', m).hidden = d.freq !== 'monthly'; };
    upd();
    $$('#rF button', m).forEach(b => b.onclick = () => { d.freq = b.dataset.f; upd(); });
    $$('#rD button', m).forEach(b => b.onclick = () => { const x = +b.dataset.d; d.days = d.days.includes(x) ? d.days.filter(y => y !== x) : [...d.days, x]; b.classList.toggle('on'); });
    const clearFuture = id => { const t0 = todayStr(); S.tasks = S.tasks.filter(t => !(t.recurId === id && !t.done && t.dueDate >= t0)); const rr = S.recurring.find(x => x.id === id); if(rr && rr.gen) Object.keys(rr.gen).forEach(k => { if(k >= t0) delete rr.gen[k]; }); };
    $('#rNo', m).onclick = () => manageRecurring();
    $('#rOk', m).onclick = () => {
      d.title = $('#rT', m).value.trim(); d.time = $('#rTime', m).value || '07:30'; d.classId = $('#rC', m).value; d.notes = $('#rN', m).value.trim();
      d.monthDay = $('#rMD', m).value === 'last' ? 'last' : +$('#rMD', m).value; d.skipHolidays = $('#rSk', m).checked; if($('#rP', m)) d.paused = $('#rP', m).checked;
      if(!d.title){ toast('כתוב מה להזכיר', true); return; }
      if(d.freq === 'weekly' && !d.days.length){ toast('בחר לפחות יום אחד', true); return; }
      if(r){ clearFuture(r.id); Object.assign(r, d, {gen: r.gen}); } else S.recurring.push(d);
      ensureRecurring(); save(); toast('נשמר'); manageRecurring();
    };
    const del = $('#rDel', m);
    if(del) del.onclick = async () => {
      if(!(await confirmBox('למחוק את התזכורת החוזרת? מופעים שכבר בוצעו נשארים.', 'מחק', true))) return;
      clearFuture(r.id); S.recurring = S.recurring.filter(x => x.id !== r.id); save(); manageRecurring();
    };
  }, () => rerender());
}

/* ---------- what's new (once per version for existing users) ---------- */
function whatsNew(){
  if(!S.settings.onboarded || S.settings.seenVersion === APP_VERSION) return false;
  S.settings.seenVersion = APP_VERSION; save();
  openModal(`<h2>מה חדש ב-ClassNest ${APP_VERSION}</h2>
    <div class="item"><div style="font-size:22px">🔁</div><div class="item-main"><div class="item-title">שינויים חד-פעמיים</div><div class="hint">ביטול, מילוי מקום או הזזה של שיעור בודד (בכרטיס השיעור), ושיעור נוסף מדף הבית. תזכורות עוברות לבד לשיעור הבא.</div></div></div>
    <div class="item"><div style="font-size:22px">🚌</div><div class="item-main"><div class="item-title">אירוע לכיתות מסוימות</div><div class="hint">טיול של שכבה? אירוע עם "אין לימודים" רק לכיתות שבחרת.</div></div></div>
    <div class="item"><div style="font-size:22px">👧</div><div class="item-main"><div class="item-title">תלמידים ומעקב הגשות</div><div class="hint">כפתור 👥 ליד שיעורי בית: ✓ הגיש, ✗ לא הגיש, ⌀ חסר. במסך התלמידים רואים מי חוזר על עצמו.</div></div></div>
    <div class="item"><div style="font-size:22px">📋</div><div class="item-main"><div class="item-title">הכנה לשיעור הבא</div><div class="hint">כותבים בסוף כרטיס השיעור, ורואים את זה כשהשיעור הבא מגיע.</div></div></div>
    <div class="item"><div style="font-size:22px">🗓️</div><div class="item-main"><div class="item-title">תזכורות חוזרות</div><div class="hint">במסך המשימות: כל שבוע או כל חודש.</div></div></div>
    <div class="modal-actions"><button class="btn primary" id="wnOk">מעולה</button></div>`, m => { $('#wnOk', m).onclick = () => closeModal(); });
  return true;
}
/* =====================================================================
   INIT
   ===================================================================== */
let hiddenAt = 0;
async function init(){
  if(location.protocol === 'file:'){
    const b = document.createElement('div'); b.className = 'banner'; b.style.margin = '12px';
    b.textContent = '⚠️ האפליקציה נפתחה מקובץ מקומי (אולי מתוך ZIP). הקלטה, התקנה ועבודה אופליין לא יעבדו כך — פתח אותה מהכתובת ב-GitHub Pages.';
    document.body.prepend(b);
  }
  await Store.init();
  await loadState();
  await Vault.load();
  mergeBuiltinCalendar();
  ['overrides','students','preps','recurring'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });
  pruneOverrides(); ensureRecurring(); reflowTasks();
  applyTheme(); updateAiLed();
  if(Store.mode === 'memory') toast('הדפדפן חוסם שמירה — הנתונים לא יישמרו אחרי סגירה', true);
  await showLock();
  try{ history.replaceState({name:'home', p:{}}, ''); }catch(e){}
  go('home', {}, false);
  if(!S.settings.onboarded) showGuide(() => { if(!S.slots.some(s => s.classId)) go('setup'); });
  else if(!whatsNew()) showReminderSheet(false);
  reminderTick();
  let lastDay = todayStr();
  setInterval(() => { if(todayStr() !== lastDay){ lastDay = todayStr(); ensureRecurring(); reflowTasks(); } reminderTick(); if(current === 'home' && !$('.modal-bg')) RENDER.home(params); }, 60000);
  if(S.slots.some(s => s.classId)) requestPersist();
}
document.addEventListener('visibilitychange', async () => {
  if(document.hidden){ hiddenAt = Date.now(); save(true); return; }
  const away = Date.now() - hiddenAt;
  if(hiddenAt && S.settings.pinHash && away > 5*60000){ await showLock(); }
  if(hiddenAt && away > 20*60000){ rerender(); if(!$('.modal-bg')) showReminderSheet(false); }
  reminderTick();
});
window.addEventListener('pagehide', () => save(true));
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => logErr('sw: ' + e.message)));
}
init().catch(e => { logErr('init: ' + e.message); toast('שגיאה בפתיחה: ' + e.message, true); });
window.__MODS = Object.assign(window.__MODS || {}, {classnest: 1});
</script>
