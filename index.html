<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://generativelanguage.googleapis.com https://api.anthropic.com https://api.openai.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ClassNest · היומן של המורה</title>
<meta name="description" content="יומן תזכורות למורה: מערכת שעות, סיכומי שיעור, שיעורי בית ואירועי בית הספר">
<meta name="theme-color" content="#060606">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="ClassNest · היומן של המורה">
<meta property="og:description" content="מערכת שעות, סיכומי שיעור, שיעורי בית ותזכורות — הכול על המכשיר">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ClassNest · tokens ===== */
:root{
  --bg:#060606; --surface:#111009; --surface2:#1a1810; --line:rgba(212,175,55,.22); --line-strong:rgba(212,175,55,.55);
  --gold:#d4af37; --gold-soft:#e9cf7a; --ink:#f3ecd8; --muted:#a79f8a; --danger:#e0685a; --ok:#6fbf8a; --info:#7fb0d8;
  --on-gold:#0b0a06; --shadow:0 1px 0 rgba(212,175,55,.08);
  --serif:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --sans:"Assistant","Segoe UI",Arial,sans-serif;
  --r-sm:8px; --r:14px; --r-lg:22px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f3e8; --surface:#fffdf6; --surface2:#f1ead6; --line:rgba(140,108,20,.25); --line-strong:rgba(140,108,20,.6);
  --gold:#9a7412; --gold-soft:#7a5b0c; --ink:#1d1a12; --muted:#6c6452; --danger:#b23b2e; --ok:#2f7d4f; --info:#2f6690;
  --on-gold:#fffdf6; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.skip{position:absolute;inset-inline-start:-999px;top:0;background:var(--gold);color:var(--on-gold);padding:8px 12px;z-index:99}
.skip:focus{inset-inline-start:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== layout ===== */
.app{max-width:760px;margin:0 auto;padding:0 16px 130px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:10px}
.brand small{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted)}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font-size:16px}
.icon-btn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;display:inline-grid;place-items:center;cursor:pointer;font-size:19px;position:relative}
.icon-btn .dot[hidden]{display:none}
.icon-btn .dot{position:absolute;top:6px;inset-inline-end:6px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ai-led{width:10px;height:10px;border-radius:50%;background:var(--danger);display:inline-block}
.ai-led.on{background:var(--ok)}
.screen{display:none;animation:in .18s ease-out}
.screen.active{display:block}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen-head{display:flex;align-items:center;gap:10px;margin:18px 0 14px}
.screen-head h1{font-family:var(--serif);font-size:28px;font-weight:900;margin:0;flex:1;line-height:1.2}
.back{height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;cursor:pointer;font-size:16px}
h2{font-family:var(--serif);font-weight:700;font-size:21px;margin:26px 0 10px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ===== today hero ===== */
.hero{margin:18px 0 6px}
.hero-date{font-family:var(--serif);font-size:34px;font-weight:900;line-height:1.1;margin:0}
.hero-sub{color:var(--muted);margin-top:4px}
.bells{margin:18px 0 8px;border-inline-start:2px solid var(--line-strong);padding-inline-start:0}
.bell{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;background:transparent;border-inline:none;border-top:none;width:100%;text-align:start}
.bell:hover{background:var(--surface)}
.bell-n{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--gold);text-align:center;line-height:1}
.bell-t{font-size:13px;color:var(--muted)}
.bell-title{font-weight:700;font-size:18px}
.bell.now{background:var(--surface2)}
.bell.now::before{content:"";position:absolute;inset-inline-start:-2px;top:0;bottom:0;width:4px;background:var(--gold)}
.bell.past .bell-n,.bell.past .bell-title{opacity:.55}
.bell.free .bell-title{color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border:1px solid var(--line-strong);color:var(--gold);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.warn{border-color:var(--danger);color:var(--danger)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.info{border-color:var(--info);color:var(--info)}
.chip-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.noschool{border:1px dashed var(--line-strong);border-radius:var(--r);padding:18px;margin:16px 0;text-align:center}
.noschool b{font-family:var(--serif);font-size:22px;color:var(--gold);display:block}

/* ===== nav tiles ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.tile{min-height:92px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{border-color:var(--line-strong)}
.tile .ic{font-size:24px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted)}

/* ===== lists / cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.item:last-child{border-bottom:none}
.item-main{flex:1;min-width:0}
.item-title{font-weight:700}
.item-meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:3px;align-items:center}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--gold);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--on-gold);font-weight:900}
.check.on{background:var(--gold)}
.edit-btn{border:1px solid var(--line);background:transparent;border-radius:10px;min-width:40px;height:40px;cursor:pointer;flex:none}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.section-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.section-row h2{margin-bottom:6px}

/* ===== buttons / forms ===== */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fab{position:fixed;inset-inline-start:max(16px,calc(50% - 364px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;height:58px;padding:0 22px;border-radius:29px;background:var(--gold);color:var(--on-gold);border:none;font-weight:800;font-size:17px;box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
input[type=text],input[type=time],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface2);padding:10px 12px;outline:none}
textarea{min-height:140px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.seg button{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-weight:600}
.seg button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg button.on .tag{color:var(--on-gold);border-color:var(--on-gold)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--gold)}
.hint{font-size:13.5px;color:var(--muted);margin-top:4px}

/* ===== timetable grid ===== */
.tt-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tt{border-collapse:separate;border-spacing:3px;min-width:340px;width:100%;table-layout:fixed}
.tt th{font-size:13px;color:var(--muted);font-weight:700;padding:4px}
.tt th.pn{font-family:var(--serif);color:var(--gold);font-size:22px;width:34px}
.tt td{padding:0}
.cell{width:100%;min-height:62px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:12px;line-height:1.2;overflow:hidden}
.cell b,.cell span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.cell.empty-c{color:var(--muted);border-style:dashed;background:transparent}
.cell b{font-size:13.5px!important}
bdi.t{unicode-bidi:isolate;direction:ltr}
.cell.today{border-color:var(--gold)}

/* ===== modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 18px calc(84px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
/* bottom room so the shared AppNest Assistant button (fixed, bottom-left) never covers modal actions */
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{margin-top:0}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:var(--r-lg)}}

.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:90;max-width:90vw;text-align:center}
.toast.err{background:var(--danger);color:#fff}

/* ===== lesson ===== */
.lesson-head{border-bottom:1px solid var(--line);padding-bottom:12px}
.lesson-kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted)}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-live{color:var(--danger);font-weight:800;display:flex;align-items:center;gap:6px}
.rec-live::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.audio-item{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.audio-item audio{width:100%}
.prev{border-inline-start:3px solid var(--line-strong);padding:6px 12px;margin:10px 0;color:var(--muted);white-space:pre-wrap}
.prev b{color:var(--ink)}

/* ===== lock ===== */
.lock{position:fixed;inset:0;background:var(--bg);z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.lock h1{font-family:var(--serif);margin:0}
.pin-in{font-size:28px;letter-spacing:10px;text-align:center;max-width:220px}

/* ===== guide ===== */
.guide-step{text-align:center;padding:10px 4px}
.guide-step .big{font-size:52px}
.guide-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.guide-dots i{width:8px;height:8px;border-radius:4px;background:var(--line-strong)}
.guide-dots i.on{background:var(--gold);width:22px}

.badge-foot{text-align:center;color:var(--muted);font-size:13px;margin:34px 0 0}
.badge-foot b{color:var(--gold);font-family:var(--serif)}
.banner{border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14.5px}
.banner.info{border-color:var(--line-strong);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
pre.diag{white-space:pre-wrap;font-size:12.5px;background:var(--surface2);padding:10px;border-radius:10px;max-height:260px;overflow:auto;direction:ltr;text-align:left}

@media print{
  body{background:#fff;color:#000}
  .topbar,.fab,.back,.no-print,.tiles{display:none!important}
  .screen{display:none!important}
  #printArea{display:block!important}
}
#printArea{display:none}
</style>
</head>
<body>
<a class="skip" href="#main">דלג לתוכן</a>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">📘</span><span>ClassNest<br><small>היומן של המורה <span class="ai-led" id="aiLed" title="בינה לא מחוברת" style="margin-inline-start:4px"></span></small></span></div>
    <button class="icon-btn" id="btnAlerts" aria-label="תזכורות פתוחות" title="תזכורות">🔔<span class="dot" id="alertDot" hidden>0</span></button>
    <button class="icon-btn" id="btnTheme" aria-label="החלף מצב יום/לילה" title="יום/לילה">🌙</button>
    <button class="icon-btn" id="btnAbout" aria-label="אודות" title="אודות">ℹ️</button>
  </header>
  <main id="main" tabindex="-1">
    <section class="screen active" id="scr-home" aria-label="היום שלי"></section>
    <section class="screen" id="scr-timetable" aria-label="מערכת שעות"></section>
    <section class="screen" id="scr-lesson" aria-label="שיעור"></section>
    <section class="screen" id="scr-tasks" aria-label="משימות ושיעורי בית"></section>
    <section class="screen" id="scr-events" aria-label="לוח אירועים"></section>
    <section class="screen" id="scr-journal" aria-label="יומן שיעורים"></section>
    <section class="screen" id="scr-settings" aria-label="הגדרות"></section>
    <section class="screen" id="scr-setup" aria-label="הגדרת בית הספר"></section>
    <section class="screen" id="scr-about" aria-label="אודות"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="printArea"></div>
<script>
/* =====================================================================
   ClassNest — היומן של המורה · AppNest 2026 · Barak Aflalo
   Single-file PWA. Data stays on the device (IndexedDB → localStorage → memory).
   Critical fixes carried from the AppNest base spec (v11) — do not remove:
   - Storage shim with fallback chain + persist() request
   - API key encrypted with AES-GCM (non-extractable CryptoKey), never in backups
   - Model "golden rule": latest alias first + fallback chain + live model list
   - SW: network-first shell, never-cache AI calls, cross-origin pass-through
   ===================================================================== */
'use strict';
const APP_VERSION = '1.0.1';
const APP_NAME = 'ClassNest';

/* ---------- error log (first thing) ---------- */
const ERRLOG_KEY = 'cn_errlog';
function logErr(msg, src, line){
  try{
    const a = JSON.parse(localStorage.getItem(ERRLOG_KEY)||'[]');
    a.unshift({t:new Date().toISOString(), m:String(msg).slice(0,300), s:src||'', l:line||''});
    localStorage.setItem(ERRLOG_KEY, JSON.stringify(a.slice(0,10)));
  }catch(e){}
}
window.addEventListener('error', e => logErr(e.message, (e.filename||'').split('/').pop(), e.lineno));
window.addEventListener('unhandledrejection', e => logErr('Promise: ' + (e.reason && (e.reason.message||e.reason)), '', ''));

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_SHORT = ["א'","ב'","ג'","ד'","ה'","ו'","ש'"];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const toMin = t => { if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
function fmtDate(s, withDay=true){
  const d = pd(s);
  return (withDay ? `יום ${DAYS[d.getDay()]}, ` : '') + `${d.getDate()} ב${MONTHS[d.getMonth()]}`;
}
function relDay(s){
  const n = dayDiff(todayStr(), s);
  if(n === 0) return 'היום';
  if(n === 1) return 'מחר';
  if(n === -1) return 'אתמול';
  if(n > 1 && n < 7) return `בעוד ${n} ימים`;
  if(n < -1) return `לפני ${-n} ימים`;
  return fmtDate(s, true);
}
function toast(msg, err=false){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.setAttribute('role', err ? 'alert' : 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4200 : 2400);
}
function hapt(ms=15){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- Storage shim: IndexedDB → localStorage → memory ---------- */
const Store = (() => {
  const DB = 'classnest', VER = 1;
  let db = null, mode = 'memory';
  const mem = {kv:{}, media:{}, secrets:{}};
  function open(){
    return new Promise(res => {
      if(!('indexedDB' in window)) return res(null);
      let req;
      try{ req = indexedDB.open(DB, VER); }catch(e){ return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        ['kv','media','secrets'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    });
  }
  async function init(){
    db = await open();
    if(db){ mode = 'idb'; return mode; }
    try{ localStorage.setItem('cn_probe','1'); localStorage.removeItem('cn_probe'); mode = 'local'; }catch(e){ mode = 'memory'; }
    return mode;
  }
  function tx(store, rw, fn){
    return new Promise((res, rej) => {
      const t = db.transaction(store, rw ? 'readwrite' : 'readonly');
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('abort'));
    });
  }
  async function get(store, key){
    if(mode === 'idb') return tx(store, false, s => s.get(key));
    if(mode === 'local' && store !== 'media'){ const v = localStorage.getItem(`cn_${store}_${key}`); return v == null ? undefined : JSON.parse(v); }
    return mem[store][key];
  }
  async function set(store, key, val){
    if(mode === 'idb') return tx(store, true, s => s.put(val, key));
    if(mode === 'local' && store !== 'media' && store !== 'secrets'){ localStorage.setItem(`cn_${store}_${key}`, JSON.stringify(val)); return; }
    mem[store][key] = val;
  }
  async function del(store, key){
    if(mode === 'idb') return tx(store, true, s => s.delete(key));
    if(mode === 'local') localStorage.removeItem(`cn_${store}_${key}`);
    delete mem[store][key];
  }
  async function keys(store){
    if(mode === 'idb') return tx(store, false, s => s.getAllKeys());
    return Object.keys(mem[store]);
  }
  async function clearAll(){
    if(mode === 'idb'){ for(const s of ['kv','media','secrets']) await tx(s, true, st => st.clear()); }
    Object.keys(localStorage).filter(k => k.startsWith('cn_')).forEach(k => localStorage.removeItem(k));
    mem.kv = {}; mem.media = {}; mem.secrets = {};
  }
  return { init, get, set, del, keys, clearAll, get mode(){ return mode; } };
})();

      if(already) return true;
      return await navigator.storage.persist();

}

/* ---------- Encrypted API keys (AES-GCM 256, non-extractable) ---------- */
const Vault = (() => {
  let key = null;
  const cache = {gemini:'', claude:'', openai:''};
  async function getKey(){
    if(key) return key;
    if(!(window.crypto && crypto.subtle)) throw new Error('no-crypto');
    try{ key = await Store.get('secrets', 'aesKey'); }catch(e){}
    if(!key){
      key = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
      try{ await Store.set('secrets', 'aesKey', key); }catch(e){ logErr('vault key store: ' + e.message); }
    }
    return key;
  }
  async function put(provider, plain){
    plain = cleanKey(plain);
    if(!plain){ await Store.del('secrets', 'k_' + provider); cache[provider] = ''; return; }
    const k = await getKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(plain));
    // verify round-trip before trusting it
    const back = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, k, ct));
    if(back !== plain) throw new Error('verify-failed');
    await Store.set('secrets', 'k_' + provider, {iv: Array.from(iv), ct});
    cache[provider] = plain;
  }
  async function load(){
    for(const p of Object.keys(cache)){
      try{
        const rec = await Store.get('secrets', 'k_' + p);
        if(rec && rec.ct){
          const k = await getKey();
          cache[p] = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(rec.iv)}, k, rec.ct));
        }
      }catch(e){ logErr('vault load ' + p + ': ' + e.message); }
    }
  }
  const get = p => cache[p] || '';
  return {put, load, get};
})();
function cleanKey(k){
  // a key field may hold several keys separated by comma/newline + hidden chars — take the first clean one
  return String(k || '').split(/[\s,;]+/).map(s => s.replace(/[^\x21-\x7E]/g, '')).find(Boolean) || '';
}

/* ---------- .ics export (reliable real-time alert via the phone's calendar) ---------- */
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g, m => '\\' + m); }
function icsDT(date, time){ return date.replace(/-/g,'') + (time ? 'T' + time.replace(':','') + '00' : ''); }
function buildICS(items){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AppNest//ClassNest//HE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const it of items){
    lines.push('BEGIN:VEVENT', `UID:${it.uid}@classnest.appnest`, `DTSTAMP:${stamp}`);
    if(it.time){
      lines.push(`DTSTART:${icsDT(it.date, it.time)}`);
      const endMin = toMin(it.time) + (it.minutes || 30);
      lines.push(`DTEND:${icsDT(it.date, pad(Math.floor(endMin/60) % 24) + ':' + pad(endMin % 60))}`);
    }else{
      lines.push(`DTSTART;VALUE=DATE:${icsDT(it.date)}`, `DTEND;VALUE=DATE:${icsDT(addDays(it.end || it.date, 1))}`);
    }
    lines.push(`SUMMARY:${icsEscape(it.title)}`);
    if(it.desc) lines.push(`DESCRIPTION:${icsEscape(it.desc)}`);
    lines.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(it.title)}`, `TRIGGER:${it.time ? '-PT10M' : '-PT15H'}`, 'END:VALARM', 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
async function shareOrDownload(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime});
  try{
    const file = new File([blob], filename, {type: mime});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /\.ics$/.test(filename)){
      await navigator.share({files:[file], title: filename});
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- modal with focus-trap + Escape ---------- */
let modalCloseCb = null, lastFocus = null;
function openModal(html, onMount, onClose){
  closeModal(true);
  lastFocus = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  $('#modalRoot').appendChild(bg);
  bg.addEventListener('mousedown', e => { if(e.target === bg) closeModal(); });
  const m = $('.modal', bg);
  m.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    if(e.key === 'Tab'){
      const f = $$('button,input,select,textarea,a[href],audio', m).filter(x => !x.disabled && x.offsetParent !== null);
      if(!f.length) return;
      if(e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
    }
  });
  modalCloseCb = onClose || null;
  if(onMount) onMount(m, bg);
  const first = $('input,select,textarea', m) || $('button', m);
  if(first) setTimeout(() => first.focus(), 30);
  return m;
}
function closeModal(silent){
  const bg = $('.modal-bg'); if(!bg) return;
  bg.remove();
  const cb = modalCloseCb; modalCloseCb = null;
  if(cb && !silent) cb();
  if(lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){}
}

      m => {
        $('#cOk', m).onclick = () => { done = true; closeModal(true); res(true); };
        $('#cNo', m).onclick = () => { done = true; closeModal(true); res(false); };
      }, () => { if(!done) res(false); });
  });
}

/* ---------- long-press = edit (plus a visible edit button everywhere) ---------- */
function longPress(el, fn){
  let t = null, sx = 0, sy = 0, fired = false;
  el.addEventListener('pointerdown', e => { fired = false; sx = e.clientX; sy = e.clientY; t = setTimeout(() => { fired = true; hapt(25); fn(); }, 550); });
  const cancel = () => clearTimeout(t);
  el.addEventListener('pointerup', cancel); el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointermove', e => { if(Math.abs(e.clientX-sx) > 10 || Math.abs(e.clientY-sy) > 10) cancel(); });
  el.addEventListener('click', e => { if(fired){ e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

  document.documentElement.setAttribute('data-theme', S.settings.theme === 'light' ? 'light' : 'dark');
  $('#btnTheme').textContent = S.settings.theme === 'light' ? '🌙' : '☀️';
  $('meta[name=theme-color]').setAttribute('content', S.settings.theme === 'light' ? '#f7f3e8' : '#060606');
}
$('#btnTheme').onclick = () => { S.settings.theme = S.settings.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); };
$('#btnAbout').onclick = () => go('about');
$('#btnAlerts').onclick = () => showReminderSheet(true);

/* =====================================================================
   HOME — "היום שלי"
   ===================================================================== */
function taskRow(t, opts={}){
  const c = cls(t.classId), s = sub(t.subjectId);
  const overdue = t.dueDate && t.dueDate < todayStr() && !t.done;
  return `<div class="item" data-task="${t.id}">
    <button class="check ${t.done?'on':''}" data-toggle="${t.id}" aria-label="${t.done?'סמן כלא בוצע':'סמן כבוצע'}: ${esc(t.title)}">${t.done?'✓':''}</button>
    <div class="item-main" data-open-task="${t.id}">
      <div class="item-title">${t.kind==='hw'?'📚 ':''}${esc(t.title)}</div>
      <div class="item-meta">${c?classDot(c.id)+esc(c.name):''}${s?`<span>${esc(s.name)}</span>`:''}
        <span class="tag ${overdue?'warn':''}">${overdue?'באיחור · ':''}${esc(describeDue(t))}</span></div>
    </div>
    ${opts.noEdit?'':`<button class="edit-btn" data-open-task="${t.id}" aria-label="עריכה">✏️</button>`}
  </div>`;
}
function bindTaskRows(root){
  $$('[data-toggle]', root).forEach(b => b.onclick = e => { e.stopPropagation(); toggleTask(b.dataset.toggle); });
  $$('[data-open-task]', root).forEach(b => b.onclick = () => editTask(S.tasks.find(t => t.id === b.dataset.openTask)));
  $$('.item[data-task]', root).forEach(el => longPress(el, () => editTask(S.tasks.find(t => t.id === el.dataset.task))));
}
function toggleTask(id){
  const t = S.tasks.find(x => x.id === id); if(!t) return;
  t.done = !t.done; t.doneAt = t.done ? new Date().toISOString() : null;
  hapt(); save(); rerender();
  if(t.done) toast('סומן כבוצע ✓');
}
function eventRow(e){
  const ty = EVENT_TYPES[e.type] || EVENT_TYPES.other;
  const range = e.end && e.end !== e.date ? `${fmtDate(e.date,false)} – ${fmtDate(e.end,false)}` : fmtDate(e.date);
  return `<div class="item" data-ev="${e.id}">
    <div style="font-size:22px" aria-hidden="true">${ty.ic}</div>
    <div class="item-main"><div class="item-title">${esc(e.title)}</div>
      <div class="item-meta"><span>${esc(range)}${e.time?' · '+esc(e.time):''}</span>
      ${e.noSchool?'<span class="tag info">אין לימודים</span>':''}${e.builtin?'<span class="tag">משרד החינוך</span>':''}
      ${dayDiff(todayStr(), e.date) >= 0 && dayDiff(todayStr(), e.date) <= 7 ? `<span class="tag ok">${esc(relDay(e.date))}</span>`:''}</div>
      ${e.note?`<div class="hint">${esc(e.note)}</div>`:''}</div>
    <button class="edit-btn" data-open-ev="${e.id}" aria-label="עריכה">✏️</button></div>`;
}
function bindEventRows(root){
  $$('[data-ev]', root).forEach(el => { el.onclick = () => editEvent(S.events.find(e => e.id === el.dataset.ev)); longPress(el, () => editEvent(S.events.find(e => e.id === el.dataset.ev))); });
}

function nextSchoolDay(from){
  for(let i = 1; i < 120; i++){ const d = addDays(from, i); if(lessonsOn(d).length) return d; }
  return null;
}
function renderBells(date){
  const lessons = lessonsOn(date);
  if(!lessons.length) return '';
  const isToday = date === todayStr(), nm = nowMin();
  const first = lessons[0].bell.n, last = lessons[lessons.length-1].bell.n;
  const rows = S.settings.bells.filter(b => b.n >= first && b.n <= last).map(b => {
    const L = lessons.find(x => x.bell.n === b.n);
    const now = isToday && nm >= toMin(b.start) && nm < toMin(b.end);
    const past = isToday && nm >= toMin(b.end);
    if(!L) return `<div class="bell free ${past?'past':''}" aria-label="שיעור ${b.n} חלון"><div class="bell-n">${b.n}</div><div><div class="bell-title">חלון</div><div class="bell-t"><bdi class="t">${b.start}–${b.end}</bdi></div></div><span></span></div>`;
    const key = lessonKey(date, L.slot.id), rec = S.lessons[key];
    const checks = openTasks().filter(t => t.dueSlotId === L.slot.id && t.dueDate === date);
    const c = cls(L.slot.classId);
    return `<button class="bell ${now?'now':''} ${past?'past':''}" data-lesson="${esc(key)}" aria-label="שיעור ${b.n}: ${esc(slotLabel(L.slot))}${now?' — עכשיו':''}">
      <div class="bell-n">${b.n}</div>
      <div><div class="bell-title">${classDot(L.slot.classId)} ${esc(slotLabel(L.slot))}</div>
        <div class="bell-t"><bdi class="t">${b.start}–${b.end}</bdi>${L.slot.room?' · '+esc(L.slot.room):''}${now?' · <b style="color:var(--gold)">עכשיו</b>':''}</div></div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        ${checks.length?`<span class="tag warn">לבדוק ${checks.length}</span>`:''}
        ${rec && (rec.summary || (rec.audio||[]).length)?'<span class="tag ok">סוכם ✓</span>':''}
      </div></button>`;
  }).join('');
  return `<div class="bells">${rows}</div>`;
}
RENDER.home = () => {
  const el = $('#scr-home'), today = todayStr(), d = new Date();
  const greet = d.getHours() < 12 ? 'בוקר טוב' : d.getHours() < 17 ? 'צהריים טובים' : 'ערב טוב';
  let html = `<div class="hero"><p class="hero-date">${esc(fmtDate(today))}</p>
    <div class="hero-sub">${greet}${S.settings.userName ? ', ' + esc(S.settings.userName) : ''}${S.settings.school ? ' · ' + esc(S.settings.school) : ''}</div></div>`;
  if(!S.slots.some(s => s.classId)){
    html += `<div class="card empty"><p style="font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:700;margin:0">בוא נבנה את מערכת השעות שלך</p>
      <p>מגדירים פעם אחת את הצלצולים, הכיתות והמקצועות, ואז ממלאים את הטבלה השבועית. מכאן האפליקציה יודעת לבד מתי השיעור הבא של כל כיתה.</p>
      <button class="btn primary" data-go="setup">להגדרת בית הספר</button></div>`;
  }else{
    const ns = isNoSchool(today);
    if(ns){
      const nx = nextSchoolDay(today);
      html += `<div class="noschool"><b>${esc(ns.reason)}</b>${nx ? `<span class="muted">יום הלימודים הבא: ${esc(fmtDate(nx))}</span>` : ''}</div>`;
      if(nx){ html += `<h2>${esc(fmtDate(nx))}</h2>` + renderBells(nx); }
    }else{
      html += renderBells(today);
      const nm = nowMin(), lessons = lessonsOn(today);
      if(lessons.length && nm >= toMin(lessons[lessons.length-1].bell.end)){
        const nx = nextSchoolDay(today);
        if(nx) html += `<p class="muted small">היום נגמר. ${esc(relDay(nx))} מתחילים ב-${esc(lessonsOn(nx)[0].bell.start)} עם ${esc(slotLabel(lessonsOn(nx)[0].slot))}.</p>`;
      }
    }
  }
  const due = dueTasks();
  html += `<div class="section-row"><h2>לטיפול עכשיו</h2>${due.length?`<span class="tag warn">${due.length}</span>`:''}</div>`;
  html += due.length ? `<div class="card">${due.map(t => taskRow(t)).join('')}</div>` : `<p class="muted">אין משימות פתוחות להיום. 👌</p>`;
  const soon = openTasks().filter(t => t.dueDate && t.dueDate > today && dayDiff(today, t.dueDate) <= 3);
  if(soon.length) html += `<h3 class="muted">בימים הקרובים</h3><div class="card">${soon.map(t => taskRow(t)).join('')}</div>`;
  const evs = upcomingEvents(14);
  html += `<h2>אירועים קרובים</h2>` + (evs.length ? `<div class="card">${evs.slice(0,6).map(eventRow).join('')}</div>` : `<p class="muted">אין אירועים בשבועיים הקרובים.</p>`);
  html += `<nav class="tiles" aria-label="מסכים">
    <button class="tile" data-go="timetable"><span class="ic">🗓️</span><b>מערכת שעות</b><span>הטבלה השבועית</span></button>
    <button class="tile" data-go="tasks"><span class="ic">📚</span><b>משימות ושיעורי בית</b><span>${openTasks().length} פתוחות</span></button>
    <button class="tile" data-go="events"><span class="ic">📅</span><b>לוח אירועים</b><span>טקסים, חופשות, ימי הורים</span></button>
    <button class="tile" data-go="journal"><span class="ic">📝</span><b>יומן שיעורים</b><span>כל הסיכומים לפי כיתה</span></button>
    <button class="tile" data-go="settings"><span class="ic">⚙️</span><b>הגדרות</b><span>גיבוי, בינה, נעילה</span></button>
    <button class="tile" data-go="setup"><span class="ic">🏫</span><b>בית הספר</b><span>צלצולים, כיתות, מקצועות</span></button>
  </nav>
  <p class="badge-foot">נבנה ב-<b>AppNest</b> · גרסה ${APP_VERSION}</p>
  <button class="fab" id="fabAdd" aria-label="הוסף תזכורת">＋ תזכורת</button>`;
  el.innerHTML = html;
  $$('[data-lesson]', el).forEach(b => b.onclick = () => go('lesson', {key: b.dataset.lesson}));
  bindTaskRows(el); bindEventRows(el);
  $('#fabAdd').onclick = () => editTask(null, {});
  refreshAlertDot();
};

/* ---------- reminder sheet (shown on open when something is due) ---------- */
function showReminderSheet(manual){
  const due = dueTasks(), evs = eventAlerts();
  if(!manual && !due.length && !evs.length) return;
  openModal(`<h2>🔔 התזכורות שלך</h2>
    ${due.length ? `<h3>לטיפול</h3><div>${due.map(t => taskRow(t, {noEdit:true})).join('')}</div>` : ''}
    ${evs.length ? `<h3>אירועים קרובים</h3><div>${evs.map(eventRow).join('')}</div>` : ''}
    ${!due.length && !evs.length ? '<p class="muted">הכול מסודר — אין תזכורות פתוחות.</p>' : ''}
    <div class="modal-actions"><button class="btn primary" id="rsOk">הבנתי</button></div>`,
    m => {
      $('#rsOk', m).onclick = () => closeModal();
      $$('[data-toggle]', m).forEach(b => b.onclick = () => { toggleTask(b.dataset.toggle); b.classList.toggle('on'); b.textContent = b.classList.contains('on') ? '✓' : ''; });
      $$('[data-open-task]', m).forEach(b => b.onclick = () => { closeModal(true); editTask(S.tasks.find(t => t.id === b.dataset.openTask)); });
      $$('[data-ev]', m).forEach(b => b.onclick = () => { closeModal(true); editEvent(S.events.find(e => e.id === b.dataset.ev)); });
    });
}

RENDER.timetable = () => {
  const el = $('#scr-timetable'), days = S.settings.days.slice().sort(), todayWd = new Date().getDay();
  let html = head('מערכת שעות');
  if(!S.classes.length || !S.subjects.length){
    html += `<div class="banner info">כדי למלא את הטבלה צריך קודם להוסיף כיתות ומקצועות. <button class="btn sm" data-go="setup">להגדרת בית הספר</button></div>`;
  }
  html += `<p class="muted small">הקש על משבצת כדי לשבץ כיתה ומקצוע. הקשה על משבצת מלאה פותחת עריכה.</p>
  <div class="tt-wrap"><table class="tt"><thead><tr><th></th>${days.map(d => `<th scope="col" ${d===todayWd?'style="color:var(--gold)"':''}>${DAYS[d]}</th>`).join('')}</tr></thead><tbody>`;
  for(const b of S.settings.bells){
    html += `<tr><th class="pn" scope="row" title="${b.start}–${b.end}">${b.n}</th>`;
    for(const d of days){
      const sl = S.slots.find(s => s.day === d && s.period === b.n && s.classId);
      if(sl){
        const c = cls(sl.classId), s = sub(sl.subjectId);
        html += `<td><button class="cell ${d===todayWd?'today':''}" data-cell="${d}|${b.n}" style="border-inline-start:4px solid ${esc(c?c.color:'var(--line)')}" aria-label="${DAYS[d]} שיעור ${b.n}: ${esc(slotLabel(sl))}"><b>${esc(c?c.name:'')}</b><span>${esc(s?s.name:'')}</span></button></td>`;
      }else html += `<td><button class="cell empty-c" data-cell="${d}|${b.n}" aria-label="${DAYS[d]} שיעור ${b.n}: ריק">＋</button></td>`;
    }
    html += '</tr>';
  }
  html += `</tbody></table></div>
  <div class="btn-row"><button class="btn" data-go="setup">🏫 צלצולים, כיתות ומקצועות</button><button class="btn" id="ttPrint">🖨️ הדפס / PDF</button></div>
  <p class="hint">שבוע לימודים: ${days.map(d => DAYS[d]).join(', ')}. אפשר לשנות בהגדרות בית הספר.</p>`;
  el.innerHTML = html;
  $$('[data-cell]', el).forEach(b => b.onclick = () => { const [d,n] = b.dataset.cell.split('|').map(Number); editSlot(d, n); });
  $('#ttPrint').onclick = printTimetable;
};
function optionList(arr, sel, empty){
  return (empty ? `<option value="">${esc(empty)}</option>` : '') + arr.map(x => `<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
}
function editSlot(day, n){
  const ex = S.slots.find(s => s.day === day && s.period === n);
  const b = bell(n);
  openModal(`<h2>${DAYS[day]} · שיעור ${n}</h2><p class="muted"><bdi class="t">${b.start}–${b.end}</bdi></p>
    <label class="f"><span>כיתה</span><select id="sClass">${optionList(S.classes, ex&&ex.classId, 'בחר כיתה')}<option value="__new">＋ כיתה חדשה…</option></select></label>
    <label class="f"><span>מקצוע</span><select id="sSub">${optionList(S.subjects, ex&&ex.subjectId, 'בחר מקצוע')}<option value="__new">＋ מקצוע חדש…</option></select></label>
    <label class="f"><span>חדר / מקום (לא חובה)</span><input type="text" id="sRoom" value="${esc(ex&&ex.room||'')}" placeholder="למשל: מעבדה, חדר 12"></label>
    <div class="modal-actions"><button class="btn primary" id="sSave">שמור</button>${ex&&ex.classId?'<button class="btn danger" id="sClear">רוקן משבצת</button>':''}<button class="btn" id="sCancel">ביטול</button></div>`,
    m => {
      const handleNew = (sel, list, label) => sel.onchange = () => {
        if(sel.value !== '__new') return;
        const name = (prompt(label) || '').trim();
        if(!name){ sel.value = ''; return; }
        const item = {id: uid(), name};
        if(list === S.classes) item.color = CLASS_COLORS[S.classes.length % CLASS_COLORS.length];
        list.push(item); save();
        sel.innerHTML = optionList(list, item.id, list === S.classes ? 'בחר כיתה' : 'בחר מקצוע') + `<option value="__new">＋ ${list===S.classes?'כיתה חדשה':'מקצוע חדש'}…</option>`;
      };
      handleNew($('#sClass', m), S.classes, 'שם הכיתה (למשל ד׳2):');
      handleNew($('#sSub', m), S.subjects, 'שם המקצוע (למשל מתמטיקה):');
      $('#sCancel', m).onclick = () => closeModal();
      $('#sSave', m).onclick = () => {
        const classId = $('#sClass', m).value, subjectId = $('#sSub', m).value;
        if(!classId || classId === '__new'){ toast('בחר כיתה', true); return; }
        const rec = ex || {id: uid(), day, period: n};
        rec.classId = classId; rec.subjectId = subjectId && subjectId !== '__new' ? subjectId : ''; rec.room = $('#sRoom', m).value.trim();
        if(!ex) S.slots.push(rec);
        save(); closeModal(); rerender(); toast('נשמר');
      };
      const clr = $('#sClear', m);
      if(clr) clr.onclick = async () => {
        if(!(await confirmBox('לרוקן את המשבצת? סיכומי שיעורים קודמים נשמרים ביומן.', 'רוקן', true))) return;
        ex.classId = ''; ex.subjectId = ''; ex.room = ''; save(); rerender();
      };
    });
}
function printTimetable(){
  const days = S.settings.days.slice().sort();
  let h = `<h1 style="font-family:serif">מערכת שעות${S.settings.userName?' — '+esc(S.settings.userName):''}</h1><p>${esc(S.settings.school||'')} · הודפס ${esc(fmtDate(todayStr()))}</p>
  <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;text-align:center"><tr><th>#</th>${days.map(d=>`<th>${DAYS[d]}</th>`).join('')}</tr>`;
  for(const b of S.settings.bells){
    h += `<tr><th>${b.n}<br><small><bdi class="t">${b.start}–${b.end}</bdi></small></th>` + days.map(d => { const sl = S.slots.find(s => s.day===d && s.period===b.n && s.classId); return `<td>${sl?esc(slotLabel(sl)):''}</td>`; }).join('') + '</tr>';
  }
  h += `</table><p style="font-size:12px">ClassNest · AppNest</p>`;
  doPrint(h);
}
function doPrint(html){
  const pa = $('#printArea'); pa.innerHTML = html;
  setTimeout(() => { window.print(); }, 60);
}

function editTask(t, ctx={}){
  const isNew = !t;
  const origin = ctx.origin || (t && t.origin) || null; // {date, slotId}
  const osl = origin && slot(origin.slotId);
  const draft = t ? {...t} : {id:uid(), kind: ctx.kind || (osl ? 'hw' : 'task'), title:'', notes:'', classId: osl ? osl.classId : (ctx.classId||''), subjectId: osl ? osl.subjectId : (ctx.subjectId||''),
    dueMode: osl || ctx.classId ? S.settings.defaultHwMode : 'date', dueDate: '', dueTime:'', dueSlotId:'', done:false, createdAt:new Date().toISOString(), origin};
  if(isNew && draft.dueMode === 'date'){ draft.dueDate = addDays(todayStr(), 1); draft.dueTime = '07:30'; }
  openModal(`<h2>${isNew ? (draft.kind==='hw'?'שיעורי בית חדשים':'תזכורת חדשה') : 'עריכת תזכורת'}</h2>
    <div class="seg" id="tKind"><button data-k="hw" class="${draft.kind==='hw'?'on':''}">📚 שיעורי בית</button><button data-k="task" class="${draft.kind==='task'?'on':''}">📌 משימה / תזכורת</button></div>
    <label class="f"><span id="tTitleLbl">${draft.kind==='hw'?'מה נתת לתלמידים?':'מה צריך לזכור?'}</span><input type="text" id="tTitle" value="${esc(draft.title)}" placeholder="${draft.kind==='hw'?'למשל: עמ׳ 34 תרגילים 1–6':'למשל: להחזיר מבחנים מתוקנים'}"></label>
    <div class="row2"><label class="f"><span>כיתה</span><select id="tClass">${optionList(S.classes, draft.classId, 'כללי')}</select></label>
    <label class="f"><span>מקצוע</span><select id="tSub">${optionList(S.subjects, draft.subjectId, '—')}</select></label></div>
    <span class="small" style="font-weight:700">מתי להזכיר?</span>
    <div class="seg" id="tMode">
      <button data-m="next">בשיעור הבא</button><button data-m="tomorrow">מחר בבוקר</button><button data-m="week">בעוד שבוע</button><button data-m="date">תאריך ושעה</button><button data-m="none">בלי תאריך</button></div>
    <div id="tDateBox" class="row2" hidden><label class="f"><span>תאריך</span><input type="date" id="tDate" value="${esc(draft.dueDate)}"></label><label class="f"><span>שעה</span><input type="time" id="tTime" value="${esc(draft.dueTime||'07:30')}"></label></div>

    <label class="f"><span>הערות (לא חובה)</span><textarea id="tNotes" style="min-height:80px" placeholder="פרטים נוספים">${esc(draft.notes)}</textarea></label>
    ${t && t.done ? '<p class="tag ok">בוצע ✓</p>' : ''}
    <div class="modal-actions"><button class="btn primary" id="tSave">שמור</button>
      <button class="btn" id="tIcs" title="הוסף ליומן הטלפון לקבלת התראה בזמן">📲 ליומן הטלפון</button>
      ${!isNew ? '<button class="btn danger" id="tDel">מחק</button>' : ''}<button class="btn" id="tNo">ביטול</button></div>`,
  m => {
    let mode = draft.dueMode || 'date', touched = isNew;
    const upd = () => {
      $$('#tMode button', m).forEach(b => b.classList.toggle('on', b.dataset.m === mode));
      $('#tDateBox', m).hidden = mode !== 'date';
      const pv = $('#tPreview', m);

      if(mode === 'next'){
        if(!draft.classId){ pv.textContent = 'כדי להזכיר בשיעור הבא צריך לבחור כיתה.'; draft.dueDate = ''; draft.dueSlotId = ''; return; }
        const from = origin && slot(origin.slotId) ? origin.date : todayStr();
        const fromMin = origin && slot(origin.slotId) ? toMin((bell(slot(origin.slotId).period)||{end:'00:00'}).end) : nowMin();
        const nx = nextLesson(draft.classId, draft.subjectId, from, fromMin);
        if(nx){ draft.dueDate = nx.date; draft.dueTime = nx.time; draft.dueSlotId = nx.slotId; pv.textContent = `יזכיר ${relDay(nx.date) === fmtDate(nx.date) ? 'ב' : relDay(nx.date) + ' — '}${fmtDate(nx.date)} · שיעור ${slot(nx.slotId).period} (${nx.time})`; }
        else { draft.dueDate = ''; draft.dueSlotId = ''; pv.textContent = 'לא נמצא שיעור של הכיתה הזו במערכת. אפשר לבחור תאריך ידני.'; }
      }else if(mode === 'tomorrow'){ draft.dueDate = addDays(todayStr(), 1); draft.dueTime = '07:30'; draft.dueSlotId = ''; pv.textContent = `יזכיר ${fmtDate(draft.dueDate)} ב-07:30`; }
      else if(mode === 'week'){ draft.dueDate = addDays(todayStr(), 7); draft.dueTime = '07:30'; draft.dueSlotId = ''; pv.textContent = `יזכיר ${fmtDate(draft.dueDate)} ב-07:30`; }
      else if(mode === 'date'){ draft.dueDate = $('#tDate', m).value; draft.dueTime = $('#tTime', m).value; draft.dueSlotId = ''; pv.textContent = draft.dueDate ? `יזכיר ${fmtDate(draft.dueDate)}${draft.dueTime?' ב-'+draft.dueTime:''}` : 'בחר תאריך'; }
      else { draft.dueDate = ''; draft.dueTime = ''; draft.dueSlotId = ''; pv.textContent = 'יישאר ברשימת המשימות בלי תזכורת.'; }
      $('#tIcs', m).disabled = !draft.dueDate;

    $$('#tMode button', m).forEach(b => b.onclick = () => { mode = b.dataset.m; touched = true; upd(); });
    ['#tClass','#tSub','#tDate','#tTime'].forEach(s => $(s, m).onchange = () => { touched = true; upd(); });
    upd();
    $('#tNo', m).onclick = () => closeModal();
    const collect = () => { draft.title = $('#tTitle', m).value.trim(); draft.notes = $('#tNotes', m).value.trim(); draft.dueMode = mode; };
    $('#tIcs', m).onclick = () => { collect(); if(!draft.title){ toast('כתוב מה להזכיר', true); return; } shareOrDownload('classnest-reminder.ics', buildICS([taskToIcs(draft)]), 'text/calendar'); };
    $('#tSave', m).onclick = () => {
      collect();
      if(!draft.title){ toast(draft.kind==='hw' ? 'כתוב מה נתת לתלמידים' : 'כתוב מה להזכיר', true); return; }
      if(mode === 'date' && !draft.dueDate){ toast('בחר תאריך', true); return; }
      if(t && (t.dueDate !== draft.dueDate || t.dueTime !== draft.dueTime)) draft.notifiedAt = null;
      if(t) Object.assign(t, draft); else S.tasks.push(draft);
      save(); closeModal(); rerender(); toast(isNew ? 'התזכורת נשמרה' : 'עודכן');
    };
    const del = $('#tDel', m);
    if(del) del.onclick = async () => {
      if(!(await confirmBox('למחוק את התזכורת? אפשר לשחזר מסל המחזור בהגדרות.', 'מחק', true))) return;
      t.deleted = true; S.trash.unshift({kind:'task', id:t.id, at:new Date().toISOString(), label:t.title}); save(); rerender(); toast('הועבר לסל המחזור');
    };
  });
}

/* =====================================================================
   LESSON card — summary, dictation, recordings, homework
   ===================================================================== */
function getLesson(key, create){
  if(S.lessons[key]) return S.lessons[key];
  const [date, slotId] = key.split('|'); const sl = slot(slotId);
  const rec = {key, date, slotId, classId: sl ? sl.classId : '', subjectId: sl ? sl.subjectId : '', summary:'', audio:[], createdAt:new Date().toISOString()};
  if(create){ S.lessons[key] = rec; }
  return rec;
}
function pruneEmptyLesson(key){
  const r = S.lessons[key];
  if(r && !r.summary && !(r.audio||[]).length) delete S.lessons[key];
}
RENDER.lesson = ({key}) => {
  const el = $('#scr-lesson');
  const [date, slotId] = key.split('|'); const sl = slot(slotId);
  const rec = getLesson(key, false);
  const classId = rec.classId || (sl && sl.classId), subjectId = rec.subjectId || (sl && sl.subjectId);

/* ---------- live dictation (Web Speech — free, works best in Chrome/Android) ---------- */
let recog = null;
function toggleDictation(ta, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('הכתבה חיה לא נתמכת בדפדפן הזה (באייפון מוגבל). אפשר להקליט ולתמלל.', true); return; }
  if(recog){ recog.stop(); return; }
  recog = new SR(); recog.lang = 'he-IL'; recog.continuous = true; recog.interimResults = true;
  const base = ta.value ? ta.value.trimEnd() + ' ' : '';
  let finalTxt = '';
  recog.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalTxt += r[0].transcript + ' '; else interim += r[0].transcript;
    }
    ta.value = base + finalTxt + interim;
  };
  recog.onerror = e => { if(e.error === 'not-allowed') toast('אין הרשאת מיקרופון. אפשר לאשר בהגדרות הדפדפן.', true); else if(e.error !== 'no-speech' && e.error !== 'aborted') toast('ההכתבה נעצרה: ' + e.error, true); };
  recog.onend = () => { recog = null; btn.textContent = '🎙️ הכתבה'; btn.setAttribute('aria-pressed','false'); ta.value = base + finalTxt; ta.oninput && ta.oninput(); };
  try{ recog.start(); btn.textContent = '⏹️ עצור הכתבה'; btn.setAttribute('aria-pressed','true'); }catch(e){ recog = null; toast('לא הצלחתי להפעיל הכתבה', true); }
}

/* ---------- audio recording (MediaRecorder → Blob in IndexedDB) ---------- */
let recState = null;
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']) if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
async function toggleRecording(key, classId, subjectId){
  if(recState){ recState.rec.stop(); return; }
  const mime = pickMime();
  if(mime === null){ toast('הקלטה לא נתמכת בדפדפן הזה', true); return; }
  if(!isSecureContext){ toast('הקלטה עובדת רק באתר מאובטח (https) — לא מקובץ מקומי', true); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){
    const msg = e.name === 'NotAllowedError' ? 'אין הרשאת מיקרופון — אפשר לאשר בהגדרות הדפדפן' : e.name === 'NotFoundError' ? 'לא נמצא מיקרופון' : e.name === 'NotReadableError' ? 'המיקרופון תפוס באפליקציה אחרת' : 'לא הצלחתי לפתוח מיקרופון';
    toast(msg, true); return;
  }
  const rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
  const chunks = [], t0 = Date.now();
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(recState && recState.timer); recState = null;
    const blob = new Blob(chunks, {type: rec.mimeType || mime || 'audio/webm'});
    if(!blob.size){ toast('ההקלטה ריקה', true); rerenderLessonIf(key); return; }
    const id = 'a_' + uid();
    try{
      await Store.set('media', id, blob);
      const r = getLesson(key, true); r.classId = r.classId || classId; r.subjectId = r.subjectId || subjectId;
      r.audio = r.audio || []; r.audio.push({id, at:new Date().toISOString(), dur:(Date.now()-t0)/1000, type: blob.type});
      save(); toast('ההקלטה נשמרה');
    }catch(e){ logErr('rec save: ' + e.message); toast('שמירת ההקלטה נכשלה (אין מקום?)', true); }
    rerenderLessonIf(key);
  };
  rec.start(1000);
  const btn = $('#lRec'), st = $('#lRecState');
  btn.textContent = '⏹️ עצור ושמור';
  recState = {rec, key, timer: setInterval(() => { const s = Math.round((Date.now()-t0)/1000); st.innerHTML = `<span class="rec-live">מקליט ${Math.floor(s/60)}:${pad(s%60)}</span>`; if(s >= 3600) rec.stop(); }, 500)};
}
function rerenderLessonIf(key){ if(current === 'lesson' && params.key === key) RENDER.lesson({key}); }
function stopAllRecording(){ try{ if(recState) recState.rec.stop(); if(recog) recog.stop(); }catch(e){} }
/* =====================================================================

const AI_PROVIDERS = {

  openai:{name:'ChatGPT (OpenAI)', tag:'API', models:['gpt-4o-mini','gpt-4o'], audio:true,
    help:`<ol class="small"><li>היכנס ל-<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>.</li><li>Create new secret key. (בתשלום לפי שימוש)</li><li>הדבק כאן. תמלול עד 25MB לקובץ.</li></ol>`}
};
function aiReady(){ const p = S.settings.ai.provider; return !!Vault.get(p); }
function updateAiLed(){ const l = $('#aiLed'); if(l){ l.classList.toggle('on', aiReady() && S.settings.ai.connected); l.title = aiReady() ? 'בינה מחוברת' : 'בינה לא מחוברת'; } }
function modelChain(){
  const p = S.settings.ai.provider, prefs = S.settings.ai.model ? [S.settings.ai.model] : [];
  return [...new Set([...prefs, ...AI_PROVIDERS[p].models])];

const safeFetch = (...a) => window.fetch(...a);
async function aiText(prompt, system){
  const p = S.settings.ai.provider, key = Vault.get(p);
  if(!key) throw new Error('אין מפתח בינה — אפשר לחבר בהגדרות');
  let lastErr = null;
  for(const model of modelChain()){
    try{
      let r, j;
      if(p === 'gemini'){
        r = await safeFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({systemInstruction: system ? {parts:[{text:system}]} : undefined, contents:[{role:'user', parts:[{text:prompt}]}]})});
        if(r.status === 404){ lastErr = new Error('model 404: ' + model); continue; }
        j = await r.json(); if(!r.ok) throw new Error(j.error && j.error.message || r.status);
        return (j.candidates && j.candidates[0] && j.candidates[0].content.parts.map(x => x.text || '').join('')) || '';
      }
      if(p === 'claude'){
        r = await safeFetch('https://api.anthropic.com/v1/messages', {method:'POST',
          headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body: JSON.stringify({model, max_tokens:1500, system: system || undefined, messages:[{role:'user', content:prompt}]})});
        if(r.status === 404){ lastErr = new Error('model 404: ' + model); continue; }
        j = await r.json(); if(!r.ok) throw new Error(j.error && j.error.message || r.status);
        return j.content.map(x => x.text || '').join('');
      }
      if(p === 'openai'){
        r = await safeFetch('https://api.openai.com/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + key},
          body: JSON.stringify({model, messages:[...(system ? [{role:'system', content:system}] : []), {role:'user', content:prompt}]})});
        if(r.status === 404){ lastErr = new Error('model 404: ' + model); continue; }
        j = await r.json(); if(!r.ok) throw new Error(j.error && j.error.message || r.status);
        return j.choices[0].message.content || '';
      }
    }catch(e){ lastErr = e; if(!/404/.test(e.message)) break; }
  }
  throw lastErr || new Error('הבינה לא זמינה');
}
function blobToB64(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
async function aiTranscribe(blob){
  const p = S.settings.ai.provider, key = Vault.get(p);
  if(!key) throw new Error('צריך לחבר Gemini או OpenAI בהגדרות כדי לתמלל');
  if(p === 'claude') throw new Error('Claude לא מתמלל אודיו. אפשר לבחור Gemini (חינם) או OpenAI בהגדרות.');
  if(p === 'openai'){
    if(blob.size > 25*1024*1024) throw new Error('ההקלטה גדולה מ-25MB — המגבלה של OpenAI');
    const ext = /mp4/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm';
    let lastErr;
    for(const model of ['gpt-4o-mini-transcribe','whisper-1']){
      const fd = new FormData(); fd.append('file', blob, 'rec.' + ext); fd.append('model', model); fd.append('language','he');
      const r = await safeFetch('https://api.openai.com/v1/audio/transcriptions', {method:'POST', headers:{Authorization:'Bearer ' + key}, body: fd});
      const j = await r.json().catch(() => ({}));
      if(r.ok) return j.text || '';
      lastErr = new Error(j.error && j.error.message || r.status);
      if(r.status !== 404 && r.status !== 400) break;
    }
    throw lastErr;
  }
  if(blob.size > 18*1024*1024) throw new Error('ההקלטה ארוכה מדי לתמלול ישיר (מעל ~18MB). כדאי להקליט בחלקים.');
  const b64 = await blobToB64(blob);
  let lastErr;
  for(const model of modelChain()){
    const r = await safeFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{role:'user', parts:[
        {inline_data:{mime_type:(blob.type || 'audio/webm').split(';')[0], data:b64}},
        {text:'תמלל את ההקלטה בעברית, מילה במילה, עם פיסוק. החזר רק את הטקסט המתומלל, בלי הקדמות.'}]}]})});
    const j = await r.json().catch(() => ({}));
    if(r.ok) return (j.candidates && j.candidates[0] && j.candidates[0].content.parts.map(x => x.text||'').join('')) || '';
    lastErr = new Error(j.error && j.error.message || r.status);
    if(r.status !== 404) break;
  }
  throw lastErr;
}
async function transcribeRecording(key, aid, btn){
  const a = (S.lessons[key].audio || []).find(x => x.id === aid);

}

  const r = await safeFetch('https://api.openai.com/v1/models', {headers:{Authorization:'Bearer ' + key}});
  const j = await r.json(); if(!r.ok) throw new Error(j.error && j.error.message || r.status);
  return (j.data||[]).map(m => m.id).filter(id => /^gpt-|^o\d/.test(id)).sort();
}

function printWeekly(){

/* ---------- CSV / backup / restore ---------- */
function csv(rows){ return '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n'); }
function exportTasksCsv(){
  const rows = [['שם המורה', S.settings.userName, 'הופק', new Date().toLocaleString('he-IL')], ['סוג','כותרת','כיתה','מקצוע','תאריך תזכורת','שעה','בוצע','הערות']];
  S.tasks.filter(t => !t.deleted).forEach(t => rows.push([t.kind==='hw'?'שיעורי בית':'משימה', t.title, cls(t.classId)&&cls(t.classId).name, sub(t.subjectId)&&sub(t.subjectId).name, t.dueDate, t.dueTime, t.done?'כן':'לא', t.notes]));
  rows.push([], ['סה"כ', S.tasks.filter(t => !t.deleted).length, 'פתוחות', openTasks().length]);
  shareOrDownload(`classnest-tasks-${todayStr()}.csv`, csv(rows), 'text/csv');
}
function exportLessonsCsv(){
  const rows = [['שם המורה', S.settings.userName, 'הופק', new Date().toLocaleString('he-IL')], ['תאריך','שיעור','כיתה','מקצוע','סיכום','תמלולים']];
  Object.values(S.lessons).sort((a,b) => a.key < b.key ? -1 : 1).forEach(l => rows.push([l.date, slot(l.slotId)?slot(l.slotId).period:'', cls(l.classId)&&cls(l.classId).name, sub(l.subjectId)&&sub(l.subjectId).name, l.summary, (l.audio||[]).map(a => a.transcript||'').filter(Boolean).join(' | ')]));
  rows.push([], ['סה"כ שיעורים מתועדים', Object.keys(S.lessons).length]);
  shareOrDownload(`classnest-lessons-${todayStr()}.csv`, csv(rows), 'text/csv');
}
async function backup(withAudio){
  const st = JSON.parse(JSON.stringify(S));
  delete st.settings.pinHash; delete st.settings.pinSalt; // PIN is per-device
  const out = {app:APP_NAME, version:APP_VERSION, exportedAt:new Date().toISOString(), user:S.settings.userName, secretsIncluded:false, state:st, media:{}};
  if(withAudio){
    for(const l of Object.values(S.lessons)) for(const a of (l.audio||[])){
      const b = await Store.get('media', a.id);
      if(b) out.media[a.id] = {type:b.type, b64: await blobToB64(b)};
    }
  }
  S.settings.lastBackup = new Date().toISOString(); save();
  shareOrDownload(`classnest-backup-${todayStr()}${withAudio?'-full':''}.json`, JSON.stringify(out), 'application/json');
  toast('קובץ הגיבוי נוצר (בלי מפתחות בינה)');
}
async function restore(file){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast('הקובץ לא נקרא — זה לא גיבוי של ClassNest', true); return; }
  if(!data || data.app !== APP_NAME || !data.state){ toast('זה לא קובץ גיבוי של ClassNest', true); return; }
  const n = Object.keys(data.state.lessons||{}).length, t = (data.state.tasks||[]).length;
  if(!(await confirmBox(`לשחזר גיבוי מ-${new Date(data.exportedAt).toLocaleDateString('he-IL')} (${n} שיעורים, ${t} משימות)? כל הנתונים הנוכחיים יוחלפו.`, 'שחזר', true))) return;
  const keepPin = {h:S.settings.pinHash, s:S.settings.pinSalt};
  try{
    for(const [id, m] of Object.entries(data.media||{})){
      const bin = Uint8Array.from(atob(m.b64), c => c.charCodeAt(0));
      await Store.set('media', id, new Blob([bin], {type:m.type}));
    }
    const base = freshState();
    S = Object.assign(base, data.state); S.settings = Object.assign(freshState().settings, data.state.settings||{});
    S.settings.pinHash = keepPin.h; S.settings.pinSalt = keepPin.s;
    await save(true);
    applyTheme(); toast('השחזור הושלם'); go('home');
  }catch(e){ logErr('restore: ' + e.message); toast('השחזור נכשל: ' + e.message, true); }
}

/* ---------- PIN lock ---------- */
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }
function showLock(){
  return new Promise(res => {
    if(!S.settings.pinHash){ res(); return; }
    if($('.lock')) return;
    const d = document.createElement('div');
    d.className = 'lock';
    d.innerHTML = `<div class="brand-mark" style="width:56px;height:56px;font-size:28px">📘</div><h1>ClassNest</h1><p class="muted">הזן קוד כדי לפתוח</p>
      <input type="password" inputmode="numeric" class="pin-in" id="pinIn" maxlength="8" autocomplete="off" aria-label="קוד נעילה"><button class="btn primary" id="pinGo">פתח</button><p class="hint" id="pinMsg" aria-live="assertive"></p>`;
    document.body.appendChild(d);
    const inp = $('#pinIn', d); setTimeout(() => inp.focus(), 50);
    const tryIt = async () => {
      if(await sha(S.settings.pinSalt + inp.value) === S.settings.pinHash){ d.remove(); res(); }
      else { $('#pinMsg', d).textContent = 'קוד שגוי'; inp.value = ''; hapt(80); }
    };
    $('#pinGo', d).onclick = tryIt;
    inp.onkeydown = e => { if(e.key === 'Enter') tryIt(); };
  });
}
function setPin(){
  openModal(`<h2>${S.settings.pinHash?'שינוי':'הגדרת'} קוד נעילה</h2><p class="muted small">הקוד נשמר מוצפן (hash) על המכשיר. אם שוכחים אותו אין דרך לשחזר — רק איפוס מלא. כדאי לגבות קודם.</p>
    <label class="f"><span>קוד חדש (4–8 ספרות)</span><input type="password" inputmode="numeric" id="p1" maxlength="8"></label>
    <label class="f"><span>שוב</span><input type="password" inputmode="numeric" id="p2" maxlength="8"></label>
    <div class="modal-actions"><button class="btn primary" id="pOk">שמור</button>${S.settings.pinHash?'<button class="btn danger" id="pOff">בטל נעילה</button>':''}<button class="btn" id="pNo">ביטול</button></div>`, m => {
    $('#pNo', m).onclick = () => closeModal();
    $('#pOk', m).onclick = async () => {
      const a = $('#p1', m).value, b = $('#p2', m).value;
      if(!/^\d{4,8}$/.test(a)){ toast('הקוד צריך להיות 4–8 ספרות', true); return; }
      if(a !== b){ toast('הקודים לא זהים', true); return; }
      S.settings.pinSalt = uid(); S.settings.pinHash = await sha(S.settings.pinSalt + a); save(); closeModal(); rerender(); toast('הנעילה הופעלה');
    };
    const off = $('#pOff', m);
    if(off) off.onclick = () => { S.settings.pinHash = null; S.settings.pinSalt = null; save(); closeModal(); rerender(); toast('הנעילה בוטלה'); };
  });
}

  const ps = $('#stPersist'); if(ps) ps.onclick = async () => { const ok = await requestPersist(); toast(ok ? 'האחסון המתמשך אושר' : 'הדפדפן לא אישר (בדרך כלל מאושר אחרי התקנה למסך הבית)', !ok); RENDER.settings(); };
  $('#stGuide').onclick = () => showGuide();
  $('#stDiag').onclick = showDiag;
  $('#stWipe').onclick = async () => {
    if(!(await confirmBox('למחוק את כל הנתונים? מערכת, סיכומים, הקלטות, משימות ומפתח הבינה.', 'המשך', true))) return;
    if(!(await confirmBox('בטוח? אין דרך לשחזר בלי קובץ גיבוי.', 'מחק הכול', true))) return;
    await Store.clearAll(); localStorage.removeItem(ERRLOG_KEY); S = freshState(); location.reload();
  };
};

function showDiag(){
  const err = JSON.parse(localStorage.getItem(ERRLOG_KEY) || '[]');
  const rep = [
    `ClassNest ${APP_VERSION}`, `UA: ${navigator.userAgent}`, `Storage: ${Store.mode}`, `Secure: ${isSecureContext}`, `Origin: ${location.protocol}`,
    `SW: ${'serviceWorker' in navigator ? (navigator.serviceWorker.controller ? 'active' : 'not controlling') : 'unsupported'}`,
    `Notification: ${'Notification' in window ? Notification.permission : 'unsupported'}`,
    `SpeechRecognition: ${!!(window.SpeechRecognition || window.webkitSpeechRecognition)}`, `MediaRecorder: ${!!window.MediaRecorder}`,
    `AI: ${S.settings.ai.provider} key=${aiReady() ? 'yes' : 'no'} model=${S.settings.ai.model || 'auto'}`,
    `Counts: classes=${S.classes.length} subjects=${S.subjects.length} slots=${S.slots.filter(s => s.classId).length} lessons=${Object.keys(S.lessons).length} tasks=${S.tasks.length} events=${S.events.length}`,
    '', 'Errors (last 10):', ...err.map(e => `${e.t} ${e.m} ${e.s}:${e.l}`)
  ].join('\n');
  openModal(`<h2>🩺 דוח אבחון</h2><p class="small muted">בלי תוכן סיכומים ובלי מפתחות — אפשר לשלוח לתמיכה.</p><pre class="diag">${esc(rep)}</pre>
    <div class="modal-actions"><button class="btn primary" id="dCopy">העתק</button><button class="btn" id="dClose">סגור</button></div>`, m => {
    $('#dCopy', m).onclick = async () => { try{ await navigator.clipboard.writeText(rep); toast('הועתק'); }catch(e){ toast('ההעתקה נכשלה', true); } };
    $('#dClose', m).onclick = () => closeModal();
  });
}

];
function showGuide(onDone){
  let i = 0;
  const draw = m => {
    const [ic, t, x] = GUIDE[i];
    m.innerHTML = `<div class="guide-step"><div class="big" aria-hidden="true">${ic}</div><h2>${t}</h2><p>${x}</p></div>
      <div class="guide-dots" aria-hidden="true">${GUIDE.map((_,k) => `<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div class="modal-actions">${i < GUIDE.length-1 ? `<button class="btn primary" id="gN">הבא</button><button class="btn" id="gS">דלג</button>` : `<button class="btn primary" id="gD">${S.slots.some(s=>s.classId)?'סיום':'בוא נתחיל'}</button>`}${i>0?'<button class="btn" id="gB">הקודם</button>':''}</div>`;
    const n = $('#gN', m), s = $('#gS', m), d = $('#gD', m), b = $('#gB', m);
    if(n) n.onclick = () => { i++; draw(m); $('button', m).focus(); };
    if(b) b.onclick = () => { i--; draw(m); };
    const finish = () => { S.settings.onboarded = true; save(); closeModal(true); if(onDone) onDone(); };
    if(s) s.onclick = finish;
    if(d) d.onclick = finish;
  };
  openModal('', m => draw(m), () => { S.settings.onboarded = true; save(); });
}

let hiddenAt = 0;
async function init(){
  if(location.protocol === 'file:'){
    const b = document.createElement('div'); b.className = 'banner'; b.style.margin = '12px';
    b.textContent = '⚠️ האפליקציה נפתחה מקובץ מקומי (אולי מתוך ZIP). הקלטה, התקנה ועבודה אופליין לא יעבדו כך — פתח אותה מהכתובת ב-GitHub Pages.';
    document.body.prepend(b);
  }
  await Store.init();
  await loadState();
  await Vault.load();
  mergeBuiltinCalendar();
  applyTheme(); updateAiLed();
  if(Store.mode === 'memory') toast('הדפדפן חוסם שמירה — הנתונים לא יישמרו אחרי סגירה', true);
  await showLock();
  try{ history.replaceState({name:'home', p:{}}, ''); }catch(e){}
  go('home', {}, false);
  if(!S.settings.onboarded) showGuide(() => { if(!S.slots.some(s => s.classId)) go('setup'); });
  else showReminderSheet(false);
  reminderTick();
  setInterval(() => { reminderTick(); if(current === 'home' && !$('.modal-bg')) RENDER.home(); }, 60000);
  if(S.slots.some(s => s.classId)) requestPersist();
}
document.addEventListener('visibilitychange', async () => {
  if(document.hidden){ hiddenAt = Date.now(); save(true); return; }
  const away = Date.now() - hiddenAt;
  if(hiddenAt && S.settings.pinHash && away > 5*60000){ await showLock(); }
  if(hiddenAt && away > 20*60000){ rerender(); if(!$('.modal-bg')) showReminderSheet(false); }
  reminderTick();
});
window.addEventListener('pagehide', () => save(true));
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => logErr('sw: ' + e.message)));
}
init().catch(e => { logErr('init: ' + e.message); toast('שגיאה בפתיחה: ' + e.message, true); });
window.__MODS = Object.assign(window.__MODS || {}, {classnest: 1});
